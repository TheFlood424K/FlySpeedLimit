name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Rename JAR for upload
        run: |
          cd target
          ORIGINAL=$(ls FlySpeedLimit-*-shaded.jar 2>/dev/null | head -n1)
          if [ -n "$ORIGINAL" ]; then
            CLEAN="${ORIGINAL/-shaded/}"
            mv "$ORIGINAL" "$CLEAN"
            echo "Renamed $ORIGINAL -> $CLEAN"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlySpeedLimit-jar
          path: target/FlySpeedLimit-*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach JAR to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Rename JAR for release
        run: |
          cd target
          ORIGINAL=$(ls FlySpeedLimit-*-shaded.jar 2>/dev/null | head -n1)
          if [ -n "$ORIGINAL" ]; then
            CLEAN="${ORIGINAL/-shaded/}"
            mv "$ORIGINAL" "$CLEAN"
          fi

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/FlySpeedLimit-*.jar
          fail_on_unmatched_files: true
