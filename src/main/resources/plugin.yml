name: FlySpeedLimit
version: ${project.version}
main: net.medievalnetwork.flyspeedlimit.FlySpeedLimit
api-version: '1.21'
description: Caps fly speed to a configurable maximum, works alongside EssentialsX.
author: TheFlood424K

commands:
  flyspeedlimit:
    description: Reload the FlySpeedLimit config.
    usage: /flyspeedlimit reload
    aliases: [fsl]
    permission: flyspeedlimit.admin

permissions:
  flyspeedlimit.admin:
    description: Allows reloading the FlySpeedLimit config.
    default: op
  flyspeedlimit.bypass:
    description: Allows bypassing the fly speed limit.
    default: false
