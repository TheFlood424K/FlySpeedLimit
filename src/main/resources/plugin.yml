name: FlySpeedLimit
version: ${project.version}
main: net.medievalnetwork.flyspeedlimit.FlySpeedLimit
api-version: '26.1.2'
description: Caps fly/walk speed with per-player permission overrides.
author: TheFlood424K
softdepend: [Essentials]

commands:
  speed:
    description: Set your fly or walk speed.
    usage: /speed <fly|walk> <0-10> [player]
  flyspeed:
    description: Set your fly speed.
    usage: /flyspeed <0-10> [player]
  fspeed:
    description: Set your fly speed.
    usage: /fspeed <0-10> [player]
  walkspeed:
    description: Set your walk speed.
    usage: /walkspeed <0-10> [player]
  wspeed:
    description: Set your walk speed.
    usage: /wspeed <0-10> [player]
  flyspeedlimit:
    description: Reload FlySpeedLimit config.
    usage: /flyspeedlimit reload
  fsl:
    description: Alias for /flyspeedlimit.
    usage: /fsl reload

permissions:
  flyspeedlimit.admin:
    description: Reload the config.
    default: op
  flyspeedlimit.bypass:
    description: Bypass all speed caps.
    default: false
  flyspeedlimit.speed:
    description: Use both /speed fly and /speed walk.
    default: false
    children:
      flyspeedlimit.speed.fly: true
      flyspeedlimit.speed.walk: true
  flyspeedlimit.speed.fly:
    description: Use /flyspeed and /speed fly.
    default: false
  flyspeedlimit.speed.walk:
    description: Use /walkspeed and /speed walk.
    default: false
  flyspeedlimit.speed.others:
    description: Change another player's speed.
    default: op
  flyspeedlimit.maxfly.1:
    default: false
  flyspeedlimit.maxfly.2:
    default: false
  flyspeedlimit.maxfly.3:
    default: false
  flyspeedlimit.maxfly.4:
    default: false
  flyspeedlimit.maxfly.5:
    default: false
  flyspeedlimit.maxfly.6:
    default: false
  flyspeedlimit.maxfly.7:
    default: false
  flyspeedlimit.maxfly.8:
    default: false
  flyspeedlimit.maxfly.9:
    default: false
  flyspeedlimit.maxfly.10:
    default: false
  flyspeedlimit.maxwalk.1:
    default: false
  flyspeedlimit.maxwalk.2:
    default: false
  flyspeedlimit.maxwalk.3:
    default: false
  flyspeedlimit.maxwalk.4:
    default: false
  flyspeedlimit.maxwalk.5:
    default: false
  flyspeedlimit.maxwalk.6:
    default: false
  flyspeedlimit.maxwalk.7:
    default: false
  flyspeedlimit.maxwalk.8:
    default: false
  flyspeedlimit.maxwalk.9:
    default: false
  flyspeedlimit.maxwalk.10:
    default: false
