# FlySpeedLimit Configuration
# --------------------------------
# Uses the same 0-10 scale as EssentialsX's /speed command.
# Internally Minecraft stores speed as 0.0-1.0; this plugin converts using
# the same formula EssentialsX uses: nativeSpeed = value / 10

# Maximum fly speed players can set with /speed fly
# e.g. 2 allows /speed fly 1 and /speed fly 2, but blocks /speed fly 3+
max-fly-speed: 2

# Maximum walk speed players can set with /speed walk
# Set to 10 for no practical limit
max-walk-speed: 10

# If true, a player's fly speed is clamped to max-fly-speed on login
enforce-on-join: true

messages:
  speed-clamped: "&cYour fly speed has been capped to the server maximum of &e{max}&c."
  reload-success: "&aFlySpeedLimit config reloaded."
  no-permission: "&cYou do not have permission to do that."
  invalid-number: "&cSpeed must be a number between 0 and 10."
  invalid-type: "&cUsage: /speed <walk|fly> <0-10> [player]"
  player-not-found: "&cPlayer not found."
  walk-set-self: "&aWalk speed set to &e{speed}&a."
  fly-set-self: "&aFly speed set to &e{speed}&a."
  walk-set-other: "&aSet &e{player}&a's walk speed to &e{speed}&a."
  fly-set-other: "&aSet &e{player}&a's fly speed to &e{speed}&a."
